name: A33 Full Storage (SD + eMMC) + Screen + USB Kbd

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 安装交叉编译环境
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-linux-gnueabihf build-essential bison flex \
            libssl-dev device-tree-compiler python3-setuptools python3-dev swig

      - name: 拉取主线 U-Boot 源码
        uses: actions/checkout@v4
        with:
          repository: u-boot/u-boot
          path: u-boot
          fetch-depth: 1

      - name: 编译全功能版 (屏幕 + USB键盘 + SD卡 + eMMC)
        working-directory: ./u-boot
        run: |
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- Sinlinx_SinA33_defconfig

          # 1. 保持已验证完美的 1024x600 RGB666 屏幕与背光配置
          ./scripts/config --enable CONFIG_VIDEO_SUNXI
          ./scripts/config --enable CONFIG_VIDEO_LCD_IF_PARALLEL
          ./scripts/config --disable CONFIG_VIDEO_LCD_IF_LVDS
          ./scripts/config --set-str CONFIG_VIDEO_LCD_MODE "x:1024,y:600,depth:18,pclk_khz:51000,le:159,ri:160,up:22,lo:12,hs:1,vs:1,sync:3,vmode:0"
          ./scripts/config --set-str CONFIG_VIDEO_LCD_BL_EN "PH7"
          ./scripts/config --set-str CONFIG_VIDEO_LCD_BL_PWM "PH0"
          ./scripts/config --enable CONFIG_CONSOLE_MUX
          ./scripts/config --enable CONFIG_SYS_CONSOLE_IS_IN_ENV
          ./scripts/config --enable CONFIG_VIDCONSOLE_AS_LCD

          # 2. 开启 I2C0 / I2C1 / I2C2 总线（支持6线电容触摸探测）
          ./scripts/config --enable CONFIG_SYS_I2C_MVTWSI
          ./scripts/config --enable CONFIG_DM_I2C
          ./scripts/config --enable CONFIG_CMD_I2C

          # 3. 保持已验证成功的 USB0 Fastboot + USB1 Host + USB键盘
          ./scripts/config --enable CONFIG_USB
          ./scripts/config --enable CONFIG_PHY_SUN4I_USB
          ./scripts/config --enable CONFIG_USB_MUSB_SUNXI
          ./scripts/config --enable CONFIG_USB_MUSB_GADGET
          ./scripts/config --enable CONFIG_USB_EHCI_HCD
          ./scripts/config --enable CONFIG_USB_EHCI_SUNXI
          ./scripts/config --enable CONFIG_USB_OHCI_HCD
          ./scripts/config --enable CONFIG_USB_OHCI_SUNXI
          ./scripts/config --enable CONFIG_CMD_USB
          ./scripts/config --enable CONFIG_USB_KEYBOARD
          ./scripts/config --enable CONFIG_SYS_USB_EVENT_POLL_VIA_INT_QUEUE
          ./scripts/config --enable CONFIG_USB_GADGET
          ./scripts/config --enable CONFIG_USB_GADGET_DOWNLOAD
          ./scripts/config --enable CONFIG_CMD_FASTBOOT
          ./scripts/config --enable CONFIG_USB_FUNCTION_FASTBOOT
          ./scripts/config --enable CONFIG_CMD_GPIO

          # 4. 完整开启 SD卡 (MMC0) + 板载 eMMC (MMC2, 8-bit) + GPT/MBR分区 + EXT4/FAT读写 + UMS虚拟U盘
          ./scripts/config --enable CONFIG_MMC
          ./scripts/config --enable CONFIG_MMC_SUNXI
          ./scripts/config --set-val CONFIG_MMC_SUNXI_SLOT_EXTRA 2
          ./scripts/config --enable CONFIG_SUPPORT_EMMC_BOOT
          ./scripts/config --enable CONFIG_CMD_MMC
          ./scripts/config --enable CONFIG_CMD_PART
          ./scripts/config --enable CONFIG_CMD_GPT
          ./scripts/config --enable CONFIG_PARTITION_UUIDS
          ./scripts/config --enable CONFIG_EFI_PARTITION
          ./scripts/config --enable CONFIG_DOS_PARTITION
          ./scripts/config --enable CONFIG_CMD_EXT4
          ./scripts/config --enable CONFIG_CMD_FAT
          ./scripts/config --enable CONFIG_CMD_FS_GENERIC
          ./scripts/config --enable CONFIG_CMD_USB_MASS_STORAGE
          ./scripts/config --enable CONFIG_USB_FUNCTION_MASS_STORAGE

          # 5. 在设备树中激活 I2C0/1/2、USB、以及 mmc0 (SD卡) 和 mmc2 (8-bit eMMC)
          cat << 'EOF' >> arch/arm/dts/sun8i-a33-sinlinx-sina33.dts

          &i2c0 {
              status = "okay";
          };

          &i2c1 {
              status = "okay";
          };

          &i2c2 {
              status = "okay";
          };

          &usbphy {
              status = "okay";
          };

          &ehci0 {
              status = "okay";
          };

          &ohci0 {
              status = "okay";
          };

          &mmc0 {
              vmmc-supply = <&reg_dcdc1>;
              bus-width = <4>;
              cd-gpios = <&pio 1 4 1>; /* PB4 */
              status = "okay";
          };

          &mmc2 {
              pinctrl-names = "default";
              pinctrl-0 = <&mmc2_8bit_pins>;
              vmmc-supply = <&reg_dcdc1>;
              bus-width = <8>;
              non-removable;
              cap-mmc-hw-reset;
              status = "okay";
          };
          EOF

          # 6. 开机自动拉高 USB-A 供电脚(不触碰PC12以免影响eMMC)，自动扫描存储设备并绑定USB键盘
          ./scripts/config --enable CONFIG_USE_BOOTCOMMAND
          ./scripts/config --set-str CONFIG_BOOTCOMMAND "gpio set PH6; gpio set PH8; gpio set PH9; gpio set PH11; gpio set PB2; gpio set PB3; sleep 1; usb start; setenv stdin serial,usbkbd; setenv stdout serial,vidconsole; setenv stderr serial,vidconsole; echo === MMC DEVICES ===; mmc list; mmc dev 0; mmc info; mmc dev 1; mmc info"

          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- olddefconfig
          make ARCH=arm CROSS_COMPILE=arm-linux-gnueabihf- -j$(nproc)

      - name: 打包全功能固件
        uses: actions/upload-artifact@v4
        with:
          name: a33-full-storage-screen-usbkbd
          path: u-boot/u-boot-sunxi-with-spl.bin
